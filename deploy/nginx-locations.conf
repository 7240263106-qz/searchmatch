location = /competition {
    return 301 https://$host/competition/;
}

location ^~ /competition/api/ {
    if ($scheme = http) { return 301 https://$host$request_uri; }
    auth_basic "Competition management";
    auth_basic_user_file /etc/nginx/competition-sj/htpasswd;
    client_max_body_size 25m;
    proxy_pass http://127.0.0.1:3011/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header Authorization "";
    proxy_set_header X-Actor-Id "";
    proxy_set_header X-Actor-Name "";
    proxy_set_header X-Actor-Roles "";
    proxy_set_header X-Team-Id "";
    proxy_read_timeout 180s;
    add_header Cache-Control "no-store" always;
    add_header X-Content-Type-Options nosniff always;
}

location ^~ /competition/ {
    if ($scheme = http) { return 301 https://$host$request_uri; }
    auth_basic "Competition management";
    auth_basic_user_file /etc/nginx/competition-sj/htpasswd;
    root /opt/competition-sj/public;
    try_files $uri $uri/ /competition/index.html;
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
}
